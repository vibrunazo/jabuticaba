# Runs the project gate (`pnpm verify`) on every push to master and every pull request:
# lint, type check, tests, content validation, generated-file checks and build.
name: Verify

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify
